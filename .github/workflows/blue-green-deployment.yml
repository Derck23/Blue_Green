name: Blue-Green Deployment Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        required: true
        default: 'switch'
        type: choice
        options:
          - switch
          - rollback
      auto_switch:
        description: 'Hacer switch automático después del deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  DOCKER_IMAGE: sports-portal
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # Job 1: Build y Test
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Instalar dependencias
      run: npm ci
    
    - name: Ejecutar linter
      run: npm run lint
    
    - name: Build de la aplicación
      run: npm run build
    
    - name: Verificar build artifacts
      run: |
        if [ ! -d "dist" ]; then
          echo "Error: El directorio dist no fue creado"
          exit 1
        fi
        echo "Build completado exitosamente"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 1

  # Job 2: Build Docker Image
  build-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub (opcional)
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .
        docker tag ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} ${{ env.DOCKER_IMAGE }}:latest
    
    - name: Test Docker image
      run: |
        docker run -d -p 8080:80 --name test-container ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
        sleep 10
        curl -f http://localhost:8080/health || exit 1
        docker stop test-container
        docker rm test-container
    
    - name: Save Docker image
      run: |
        docker save ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} | gzip > image.tar.gz
    
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar.gz
        retention-days: 1

  # Job 3: Determinar ambiente objetivo (Blue o Green)
  determine-target:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      target_env: ${{ steps.check.outputs.target_env }}
      target_port: ${{ steps.check.outputs.target_port }}
      inactive_env: ${{ steps.check.outputs.inactive_env }}
    
    steps:
    - name: Determinar ambiente inactivo
      id: check
      run: |
        # Intentar leer el estado del último deployment
        # Por defecto, si no existe, usar GREEN como primer target
        CURRENT_ACTIVE="${{ vars.ACTIVE_ENVIRONMENT || 'blue' }}"
        
        if [ "$CURRENT_ACTIVE" == "blue" ]; then
          echo "target_env=green" >> $GITHUB_OUTPUT
          echo "target_port=8082" >> $GITHUB_OUTPUT
          echo "inactive_env=green" >> $GITHUB_OUTPUT
          echo "Ambiente activo: BLUE -> Desplegando en: GREEN"
        else
          echo "target_env=blue" >> $GITHUB_OUTPUT
          echo "target_port=8081" >> $GITHUB_OUTPUT
          echo "inactive_env=blue" >> $GITHUB_OUTPUT
          echo "Ambiente activo: GREEN -> Desplegando en: BLUE"
        fi

  # Job 4: Deploy to inactive environment
  deploy-inactive:
    needs: determine-target
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
    
    - name: Load Docker image
      run: |
        docker load < image.tar.gz
    
    - name: Deploy to ${{ needs.determine-target.outputs.target_env }} environment
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        TARGET_PORT="${{ needs.determine-target.outputs.target_port }}"
        
        echo "Desplegando a ambiente: $TARGET_ENV (puerto $TARGET_PORT)..."
        
        # Detener contenedor anterior si existe
        docker stop "app-$TARGET_ENV" 2>/dev/null || true
        docker rm "app-$TARGET_ENV" 2>/dev/null || true
        
        # Iniciar nuevo contenedor en ambiente inactivo
        docker run -d \
          -p $TARGET_PORT:80 \
          --name "app-$TARGET_ENV" \
          -e APP_ENV="$TARGET_ENV" \
          --restart unless-stopped \
          ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
        
        echo "Esperando que $TARGET_ENV esté listo..."
        sleep 15
    
    - name: Health check ${{ needs.determine-target.outputs.target_env }}
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        TARGET_PORT="${{ needs.determine-target.outputs.target_port }}"
        
        echo "Verificando salud de $TARGET_ENV en puerto $TARGET_PORT..."
        
        for i in {1..30}; do
          if curl -f http://localhost:$TARGET_PORT/ || curl -f http://localhost:$TARGET_PORT/health; then
            echo "✓ $TARGET_ENV environment is healthy"
            exit 0
          fi
          echo "Attempt $i failed, retrying..."
          sleep 2
        done
        
        echo "❌ $TARGET_ENV environment failed health check"
        docker logs "app-$TARGET_ENV"
        exit 1
    
    - name: Notificar despliegue exitoso
      if: success()
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        echo "================================"
        echo "✓ Nueva versión desplegada en $TARGET_ENV"
        echo "================================"
        echo ""
        echo "Para promover a producción:"
        echo "  1. Ve a Actions -> Blue-Green Deployment Pipeline"
        echo "  2. Click en 'Run workflow'"
        echo "  3. Selecciona 'Switch to Production'"
        echo ""
        echo "O ejecuta manualmente:"
        echo "  gh workflow run blue-green-deployment.yml"

  # Job 5: Switch to Production (Manual con workflow_dispatch)
  switch-to-production:
    needs: determine-target
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event.inputs.auto_switch == 'true')
    environment:
      name: production
      url: http://localhost
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Verificar ambos ambientes están corriendo
      run: |
        echo "Verificando estado de ambientes..."
        docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        
        # Verificar que al menos un ambiente está corriendo
        if ! docker ps | grep -q "app-blue\|app-green"; then
          echo "Error: No hay ambientes disponibles"
          exit 1
        fi
    
    - name: Switch to ${{ needs.determine-target.outputs.target_env }}
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        
        echo "================================"
        echo "Switching production to: $TARGET_ENV"
        echo "================================"
        
        # Dar permisos de ejecución al script
        chmod +x switch-environment.sh
        
        # Ejecutar script de switch
        ./switch-environment.sh "$TARGET_ENV"
    
    - name: Verify production switch
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        
        echo "Verificando que producción esté respondiendo..."
        sleep 5
        
        if curl -f http://localhost/ || curl -f http://localhost/health; then
          echo "✓ Producción actualizada exitosamente a $TARGET_ENV"
        else
          echo "❌ Error: Producción no responde correctamente"
          exit 1
        fi
    
    - name: Update active environment variable
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        echo "Actualizando variable ACTIVE_ENVIRONMENT a: $TARGET_ENV"
        # Nota: Esto requiere configurar el secreto REPO_TOKEN con permisos
        # gh variable set ACTIVE_ENVIRONMENT --body "$TARGET_ENV"
    
    - name: Summary
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        PREVIOUS_ENV="${{ vars.ACTIVE_ENVIRONMENT || 'unknown' }}"
        
        echo "================================"
        echo "SWITCH COMPLETADO"
        echo "================================"
        echo "Ambiente anterior: $PREVIOUS_ENV"
        echo "Ambiente actual: $TARGET_ENV"
        echo ""
        echo "Ambientes disponibles para rollback:"
        docker ps --filter "name=app-" --format "  - {{.Names}}: {{.Status}}"

  # Job 6: Rollback (Manual - workflow_dispatch separado)
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment:
      name: production-rollback
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Identificar ambiente para rollback
      id: rollback_target
      run: |
        CURRENT_ACTIVE="${{ vars.ACTIVE_ENVIRONMENT || 'green' }}"
        
        # Hacer rollback al ambiente opuesto
        if [ "$CURRENT_ACTIVE" == "blue" ]; then
          ROLLBACK_TO="green"
        else
          ROLLBACK_TO="blue"
        fi
        
        echo "rollback_env=$ROLLBACK_TO" >> $GITHUB_OUTPUT
        echo "Ambiente actual: $CURRENT_ACTIVE"
        echo "Rollback a: $ROLLBACK_TO"
    
    - name: Verify rollback target exists
      run: |
        ROLLBACK_ENV="${{ steps.rollback_target.outputs.rollback_env }}"
        
        if ! docker ps | grep -q "app-$ROLLBACK_ENV"; then
          echo "Error: El ambiente $ROLLBACK_ENV no está disponible"
          docker ps --filter "name=app-"
          exit 1
        fi
        
        echo "✓ Ambiente $ROLLBACK_ENV está disponible para rollback"
    
    - name: Execute rollback to ${{ steps.rollback_target.outputs.rollback_env }}
      run: |
        ROLLBACK_ENV="${{ steps.rollback_target.outputs.rollback_env }}"
        
        echo "================================"
        echo "EXECUTING ROLLBACK"
        echo "================================"
        echo "Rollback to: $ROLLBACK_ENV"
        
        chmod +x switch-environment.sh
        ./switch-environment.sh "$ROLLBACK_ENV"
    
    - name: Verify rollback
      run: |
        echo "Verificando rollback..."
        sleep 5
        
        if curl -f http://localhost/ || curl -f http://localhost/health; then
          echo "✓ Rollback completado exitosamente"
        else
          echo "❌ Error en rollback"
          exit 1
        fi
    
    - name: Update environment variable
      run: |
        ROLLBACK_ENV="${{ steps.rollback_target.outputs.rollback_env }}"
        echo "Actualizando ACTIVE_ENVIRONMENT a: $ROLLBACK_ENV"
        
    - name: Rollback summary
      run: |
        ROLLBACK_ENV="${{ steps.rollback_target.outputs.rollback_env }}"
        
        echo "================================"
        echo "ROLLBACK COMPLETADO"
        echo "================================"
        echo "Producción ahora usa: $ROLLBACK_ENV"
        echo ""
        echo "Estado de contenedores:"
        docker ps --filter "name=app-" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
