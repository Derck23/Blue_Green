name: Blue-Green Deployment Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        required: true
        default: 'switch'
        type: choice
        options:
          - switch
          - rollback
      auto_switch:
        description: 'Hacer switch automático después del deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  DOCKER_IMAGE: sports-portal
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # Job 1: Build y Test
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Instalar dependencias
      run: npm ci
    
    - name: Ejecutar linter
      run: npm run lint
    
    - name: Build de la aplicación
      run: npm run build
    
    - name: Verificar build artifacts
      run: |
        if [ ! -d "dist" ]; then
          echo "Error: El directorio dist no fue creado"
          exit 1
        fi
        echo "Build completado exitosamente"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 1

  # Job 2: Build Docker Image
  build-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub (opcional)
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .
        docker tag ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} ${{ env.DOCKER_IMAGE }}:latest
    
    - name: Test Docker image
      run: |
        docker run -d -p 8080:80 --name test-container ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
        sleep 10
        curl -f http://localhost:8080/health || exit 1
        docker stop test-container
        docker rm test-container
    
    - name: Save Docker image
      run: |
        docker save ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} | gzip > image.tar.gz
    
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar.gz
        retention-days: 1

  # Job 3: Determinar ambiente objetivo (Blue o Green)
  determine-target:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      target_env: ${{ steps.check.outputs.target_env }}
      target_port: ${{ steps.check.outputs.target_port }}
      inactive_env: ${{ steps.check.outputs.inactive_env }}
      current_env: ${{ steps.check.outputs.current_env }}
    
    steps:
    - name: 🔍 BLUE-GREEN SWITCHING - Detectando ambiente actual
      run: |
        echo "══════════════════════════════════════════════════════════"
        echo "     🔍 DETECCIÓN DE AMBIENTE BLUE-GREEN"
        echo "══════════════════════════════════════════════════════════"
        echo ""
        echo "📊 Variable de estado:"
        echo "   ACTIVE_ENVIRONMENT = ${{ vars.ACTIVE_ENVIRONMENT || 'blue (default)' }}"
        echo ""
    
    - name: 🎯 Determinar ambiente para switching
      id: check
      run: |
        CURRENT_ACTIVE="${{ vars.ACTIVE_ENVIRONMENT || 'blue' }}"
        echo "current_env=$CURRENT_ACTIVE" >> $GITHUB_OUTPUT
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🔄 SWITCHING BLUE-GREEN DETECTADO"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        
        if [ "$CURRENT_ACTIVE" == "blue" ]; then
          echo "target_env=green" >> $GITHUB_OUTPUT
          echo "target_port=8082" >> $GITHUB_OUTPUT
          echo "inactive_env=green" >> $GITHUB_OUTPUT
          
          echo "📍 Ambiente ACTUAL:    🔵 BLUE (puerto 8081)"
          echo "📍 Ambiente OBJETIVO:  🟢 GREEN (puerto 8082)"
          echo ""
          echo "✅ SWITCHING: De BLUE → GREEN"
        else
          echo "target_env=blue" >> $GITHUB_OUTPUT
          echo "target_port=8081" >> $GITHUB_OUTPUT
          echo "inactive_env=blue" >> $GITHUB_OUTPUT
          
          echo "📍 Ambiente ACTUAL:    🟢 GREEN (puerto 8082)"
          echo "📍 Ambiente OBJETIVO:  🔵 BLUE (puerto 8081)"
          echo ""
          echo "✅ SWITCHING: De GREEN → BLUE"
        fi
        
        echo ""
        echo "══════════════════════════════════════════════════════════"

  # Job 4: Deploy to inactive environment
  deploy-inactive:
    needs: determine-target
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
    
    - name: Load Docker image
      run: |
        docker load < image.tar.gz
    
    - name: 📦 Estado Docker ANTES del deployment
      run: |
        echo "══════════════════════════════════════════════════════════"
        echo "     📦 CONTENEDORES DOCKER (ANTES)"
        echo "══════════════════════════════════════════════════════════"
        echo ""
        docker ps -a --filter "name=app-" --format "table {{.Names}}\t{{.State}}\t{{.Status}}\t{{.Ports}}" || echo "No hay contenedores previos"
        echo ""
    
    - name: 🚀 Desplegando en ambiente ${{ needs.determine-target.outputs.target_env }}
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        TARGET_PORT="${{ needs.determine-target.outputs.target_port }}"
        CURRENT_ENV="${{ needs.determine-target.outputs.current_env }}"
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🚀 DEPLOYMENT EN AMBIENTE INACTIVO"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "📍 Producción actual: $CURRENT_ENV"
        echo "🎯 Desplegando en: $TARGET_ENV (puerto $TARGET_PORT)"
        echo "🐳 Imagen: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
        echo ""
        
        echo "🧹 Limpiando contenedor anterior..."
        docker stop "app-$TARGET_ENV" 2>/dev/null || true
        docker rm "app-$TARGET_ENV" 2>/dev/null || true
        echo "✅ Limpieza completada"
        echo ""
        
        echo "🐳 Iniciando contenedor app-$TARGET_ENV..."
        docker run -d \
          -p $TARGET_PORT:80 \
          --name "app-$TARGET_ENV" \
          -e APP_ENV="$TARGET_ENV" \
          --restart unless-stopped \
          ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
        
        echo "✅ Contenedor iniciado"
        echo ""
        echo "⏳ Esperando 15 segundos..."
        sleep 15
        echo "✅ Listo"
    
    - name: 📊 Estado Docker DESPUÉS del deployment
      run: |
        echo ""
        echo "══════════════════════════════════════════════════════════"
        echo "     📊 CONTENEDORES DOCKER (DESPUÉS)"
        echo "══════════════════════════════════════════════════════════"
        echo ""
        docker ps -a --filter "name=app-" --format "table {{.Names}}\t{{.State}}\t{{.Status}}\t{{.Ports}}"
        echo ""
        echo "📝 Ambos ambientes Blue y Green están corriendo"
        echo ""
    
    - name: Health check ${{ needs.determine-target.outputs.target_env }}
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        TARGET_PORT="${{ needs.determine-target.outputs.target_port }}"
        
        echo "Verificando salud de $TARGET_ENV en puerto $TARGET_PORT..."
        
        for i in {1..30}; do
          if curl -f http://localhost:$TARGET_PORT/ || curl -f http://localhost:$TARGET_PORT/health; then
            echo "✓ $TARGET_ENV environment is healthy"
            exit 0
          fi
          echo "Attempt $i failed, retrying..."
          sleep 2
        done
        
        echo "❌ $TARGET_ENV environment failed health check"
        docker logs "app-$TARGET_ENV"
        exit 1
    
    - name: ✅ Deployment completado
      if: success()
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        CURRENT_ENV="${{ needs.determine-target.outputs.current_env }}"
        
        echo ""
        echo "╔═══════════════════════════════════════════════════════╗"
        echo "║           ✅ DEPLOYMENT EXITOSO                      ║"
        echo "╚═══════════════════════════════════════════════════════╝"
        echo ""
        echo "📊 Estado de ambientes:"
        echo "  🔵 BLUE:  $(docker ps | grep -q 'app-blue' && echo '✅ Running (8081)' || echo '⭕ Stopped')"
        echo "  🟢 GREEN: $(docker ps | grep -q 'app-green' && echo '✅ Running (8082)' || echo '⭕ Stopped')"
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎯 Nueva versión lista en: $TARGET_ENV"
        echo "📍 Producción activa en: $CURRENT_ENV"
        echo ""
        echo "⏭️  SIGUIENTE: Ejecutar SWITCH para cambiar producción"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # Job 5: Switch to Production (Manual con workflow_dispatch)
  switch-to-production:
    needs: determine-target
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event.inputs.auto_switch == 'true')
    environment:
      name: production
      url: http://localhost
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: 📊 Estado ANTES del SWITCH
      run: |
        echo "══════════════════════════════════════════════════════════"
        echo "     📊 ESTADO ANTES DEL SWITCH"
        echo "══════════════════════════════════════════════════════════"
        echo ""
        echo "🔍 Ambiente activo: ${{ vars.ACTIVE_ENVIRONMENT || 'blue' }}"
        echo ""
        echo "🐳 Contenedores Docker:"
        docker ps --filter "name=app-" --format "table {{.Names}}\t{{.State}}\t{{.Status}}\t{{.Ports}}"
        echo ""
        
        if ! docker ps | grep -q "app-blue\|app-green"; then
          echo "❌ Error: No hay ambientes disponibles"
          exit 1
        fi
        echo "✅ Verificación completada"
        echo ""
    
    - name: 🔄 Ejecutando SWITCHING Blue-Green
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        CURRENT_ENV="${{ vars.ACTIVE_ENVIRONMENT || 'blue' }}"
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🔄 SWITCHING BLUE-GREEN EN PROGRESO"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "📍 DE:   $CURRENT_ENV"
        echo "📍 HACIA: $TARGET_ENV"
        echo ""
        echo "🔧 Acción: Cambiar proxy Nginx al nuevo ambiente"
        echo ""
        
        chmod +x switch-environment.sh
        
        echo "⚙️  Ejecutando script..."
        ./switch-environment.sh "$TARGET_ENV"
        
        echo ""
        echo "✅ Switch ejecutado exitosamente"
    
    - name: Verify production switch
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        
        echo "Verificando que producción esté respondiendo..."
        sleep 5
        
        if curl -f http://localhost/ || curl -f http://localhost/health; then
          echo "✓ Producción actualizada exitosamente a $TARGET_ENV"
        else
          echo "❌ Error: Producción no responde correctamente"
          exit 1
        fi
    
    - name: Update active environment variable
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        echo "Actualizando variable ACTIVE_ENVIRONMENT a: $TARGET_ENV"
        # Nota: Esto requiere configurar el secreto REPO_TOKEN con permisos
        # gh variable set ACTIVE_ENVIRONMENT --body "$TARGET_ENV"
    
    - name: 📊 Estado DESPUÉS del SWITCH
      run: |
        echo ""
        echo "══════════════════════════════════════════════════════════"
        echo "     📊 ESTADO DESPUÉS DEL SWITCH"
        echo "══════════════════════════════════════════════════════════"
        echo ""
        echo "🐳 Contenedores Docker:"
        docker ps --filter "name=app-" --format "table {{.Names}}\t{{.State}}\t{{.Status}}\t{{.Ports}}"
        echo ""
        if docker ps | grep -q "app-proxy"; then
          echo "🔀 Proxy activo: ✅"
        fi
        echo ""
    
    - name: 🎉 Resumen del SWITCHING
      run: |
        TARGET_ENV="${{ needs.determine-target.outputs.target_env }}"
        PREVIOUS_ENV="${{ vars.ACTIVE_ENVIRONMENT || 'unknown' }}"
        
        echo ""
        echo "╔═══════════════════════════════════════════════════════╗"
        echo "║      🎉 SWITCHING COMPLETADO EXITOSAMENTE           ║"
        echo "╚═══════════════════════════════════════════════════════╝"
        echo ""
        echo "┌─────────────────────────────────────────────────────┐"
        echo "│  ANTES → DESPUÉS                                    │"
        echo "├─────────────────────────────────────────────────────┤"
        
        if [ "$PREVIOUS_ENV" == "blue" ]; then
          echo "│  🔵 BLUE    →  🟢 GREEN                            │"
        else
          echo "│  🟢 GREEN   →  🔵 BLUE                             │"
        fi
        
        echo "└─────────────────────────────────────────────────────┘"
        echo ""
        echo "📍 Producción ahora en: $TARGET_ENV"
        echo "🔄 Switching Blue-Green aplicado"
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ Blue-Green Deployment completado"
        echo "✅ Zero downtime garantizado"
        echo "✅ Rollback disponible"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # Job 6: Rollback (Manual - workflow_dispatch separado)
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment:
      name: production-rollback
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
    
    - name: Identificar ambiente para rollback
      id: rollback_target
      run: |
        CURRENT_ACTIVE="${{ vars.ACTIVE_ENVIRONMENT || 'green' }}"
        
        # Hacer rollback al ambiente opuesto
        if [ "$CURRENT_ACTIVE" == "blue" ]; then
          ROLLBACK_TO="green"
        else
          ROLLBACK_TO="blue"
        fi
        
        echo "rollback_env=$ROLLBACK_TO" >> $GITHUB_OUTPUT
        echo "Ambiente actual: $CURRENT_ACTIVE"
        echo "Rollback a: $ROLLBACK_TO"
    
    - name: Verify rollback target exists
      run: |
        ROLLBACK_ENV="${{ steps.rollback_target.outputs.rollback_env }}"
        
        if ! docker ps | grep -q "app-$ROLLBACK_ENV"; then
          echo "Error: El ambiente $ROLLBACK_ENV no está disponible"
          docker ps --filter "name=app-"
          exit 1
        fi
        
        echo "✓ Ambiente $ROLLBACK_ENV está disponible para rollback"
    
    - name: Execute rollback to ${{ steps.rollback_target.outputs.rollback_env }}
      run: |
        ROLLBACK_ENV="${{ steps.rollback_target.outputs.rollback_env }}"
        
        echo "================================"
        echo "EXECUTING ROLLBACK"
        echo "================================"
        echo "Rollback to: $ROLLBACK_ENV"
        
        chmod +x switch-environment.sh
        ./switch-environment.sh "$ROLLBACK_ENV"
    
    - name: Verify rollback
      run: |
        echo "Verificando rollback..."
        sleep 5
        
        if curl -f http://localhost/ || curl -f http://localhost/health; then
          echo "✓ Rollback completado exitosamente"
        else
          echo "❌ Error en rollback"
          exit 1
        fi
    
    - name: Update environment variable
      run: |
        ROLLBACK_ENV="${{ steps.rollback_target.outputs.rollback_env }}"
        echo "Actualizando ACTIVE_ENVIRONMENT a: $ROLLBACK_ENV"
        
    - name: Rollback summary
      run: |
        ROLLBACK_ENV="${{ steps.rollback_target.outputs.rollback_env }}"
        
        echo "================================"
        echo "ROLLBACK COMPLETADO"
        echo "================================"
        echo "Producción ahora usa: $ROLLBACK_ENV"
        echo ""
        echo "Estado de contenedores:"
        docker ps --filter "name=app-" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
