server {
    listen 80;
    server_name _;
    
    location / {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /health {
        return 200 "Active: blue\n";
        add_header Content-Type text/plain;
    }
}
